# コアライブラリ プリミティブクラス API カタログ — コアライブラリ仕様§5.1〜§5.7 が正本
# 各クラスのメソッド全てを記録すると 100+ エントリになるため、ここでは
# 「他文書 (命令カタログ等) と関係する代表メソッドおよび neg 系 (M7 関連) を網羅」する。
# 個別の operator+ 等の脱糖先は対応する builtin.numeric.*_add 等。
# AI 編集時の追加: 不足するメソッドは仕様§5.x を参照しながら追加すること。

# ───────── boolean (§5.1) ─────────
- id: corelib.boolean.eq
  kind: method
  owner: boolean
  signature: "operator==(other: boolean): boolean"
  defined_in: mozaicScript-corelib-spec.md#5.1

- id: corelib.boolean.or
  kind: method
  owner: boolean
  signature: "operator||(other: boolean): boolean"
  defined_in: mozaicScript-corelib-spec.md#5.1

- id: corelib.boolean.and
  kind: method
  owner: boolean
  signature: "operator&&(other: boolean): boolean"
  defined_in: mozaicScript-corelib-spec.md#5.1

- id: corelib.boolean.not
  kind: method
  owner: boolean
  signature: "operatorNot(): boolean"
  defined_in: mozaicScript-corelib-spec.md#5.1

