# GPU 関連の命令カタログ
# 2 種類が混在:
#   1) GPU カーネル内組み込み関数（言語§14.4）。lower 後は IR 仕様 Part 2 §G7 の文字列値になる
#   2) CPU 側ホスト連携 __builtin_gpu_* (IR 仕様 Part 2 §G8 が正本)

# ───────── ホスト連携 (CPU 側 IR、GPU IR§8 が正本) ─────────
- id: builtin.gpu.dispatch
  name: __builtin_gpu_dispatch
  group: gpu.host
  params:
    - { name: kernelHandle, type: _m64 }
    - { name: argsHandle,   type: _m64 }
    - { name: gridX,        type: _m32 }
    - { name: gridY,        type: _m32 }
    - { name: gridZ,        type: _m32 }
  returns: void
  defined_in: mozaicScript-ir-spec.md#G8
  notes: "コアライブラリ gpuDispatch() の lower 形式"

- id: builtin.gpu.sync
  name: __builtin_gpu_sync
  group: gpu.host
  params: []
  returns: void
  defined_in: mozaicScript-ir-spec.md#G8
  notes: "コアライブラリ gpuSync() の lower 形式"

- id: builtin.gpu.flush
  name: __builtin_gpu_flush
  group: gpu.host
  params: []
  returns: void
  defined_in: mozaicScript-ir-spec.md#G8
  notes: "コアライブラリ gpuFlush() の lower 形式"

- id: builtin.gpu.kernel_handle
  name: __builtin_gpu_kernel_handle
  group: gpu.host
  params:
    - { name: kernelName, type: string }
  returns: _m64
  return_semantics: "カーネル名から GpuKernel の内部ハンドルを取得"
  defined_in: mozaicScript-ir-spec.md#G8
  notes: "CLAUDE.md に「実装は整数 ID を渡す」既知のフォーマット差異あり（仕様では string）"

# ───────── GPU カーネル内組み込み (言語§14.4 / GPU IR§7) ─────────
